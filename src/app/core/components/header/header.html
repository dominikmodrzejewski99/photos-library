<header class="header">
  <nav class="header__nav">
    <a
      mat-stroked-button
      class="header__nav-btn"
      routerLink="/"
      routerLinkActive="header__nav-btn--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Photos
    </a>
    <a
      mat-stroked-button
      class="header__nav-btn"
      routerLink="/favorites"
      [class.header__nav-btn--active]="isFavoritesActive()"
    >
      Favorites
    </a>
  </nav>
</header>
