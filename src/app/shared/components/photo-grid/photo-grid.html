<div class="photo-grid">
  @for (photo of photos(); track photo.id; let i = $index) {
    <app-photo-card
      class="photo-grid__item"
      [photo]="photo"
      [priority]="i < priorityCount"
      (photoClick)="photoClick.emit($event)"
    />
  }
</div>

@if (isLoading()) {
  <div class="photo-grid__spinner">
    <mat-spinner diameter="40" />
  </div>
}

@if (error()) {
  <p class="photo-grid__error">{{ error() }}</p>
}
