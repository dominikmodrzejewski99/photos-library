<div class="photo-grid">
  @for (photo of photos(); track photo.id; let i = $index) {
    <app-photo-card
      class="photo-grid__item"
      [photo]="photo"
      [priority]="i < priorityCount"
      (photoClick)="photoClick.emit($event)"
    />
  }
</div>

@if (isLoading()) {
  <div class="photo-grid__spinner">
    <mat-spinner diameter="64" />
  </div>
}

@if (error()) {
  <div class="photo-grid__error">
    <p class="photo-grid__error-text">{{ error() }}</p>
    <button mat-stroked-button (click)="retry.emit()">Retry</button>
  </div>
}
